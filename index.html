<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#101827"
  >

  <meta
    name="description"
    content="MVA Geo — Contour Map para geração de curvas de nível"
  >

  <title>MVA Geo — Contour Map</title>

  <link rel="manifest" href="./manifest.json">

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- Estilo principal -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div id="app">

    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header class="topbar">

      <div class="brand">
        <div class="brand-main">MVA GEO</div>
        <div class="brand-sub">CONTOUR MAP</div>
      </div>

      <button
        id="settingsBtn"
        class="icon-btn"
        type="button"
        aria-label="Configurações"
        title="Configurações"
      >
        ⚙️
      </button>

    </header>


    <!-- =====================================================
         BARRA DE FERRAMENTAS
         ===================================================== -->

    <section class="toolbar">

      <button
        id="newArea"
        class="tool-btn primary"
        type="button"
      >
        ＋ Nova área
      </button>

      <button
        id="undoBtn"
        class="tool-btn"
        type="button"
      >
        ↶ Desfazer
      </button>

      <button
        id="closeBtn"
        class="tool-btn"
        type="button"
      >
        ✓ Fechar
      </button>

      <button
        id="generateBtn"
        class="tool-btn generate"
        type="button"
      >
        ⛰️ Gerar curvas
      </button>

      <button
        id="clearBtn"
        class="tool-btn danger"
        type="button"
      >
        Limpar
      </button>

      <button
        id="locateBtn"
        class="tool-btn"
        type="button"
      >
        📍 Minha posição
      </button>

    </section>


    <!-- =====================================================
         CONFIGURAÇÕES
         ===================================================== -->

    <section
      id="settingsPanel"
      class="settings-panel hidden"
    >

      <div class="settings-title">
        Configurações
      </div>

      <div class="settings-grid">

        <label class="setting">
          <span>Equidistância</span>

          <select id="interval">

            <option value="0.5">
              0,50 m
            </option>

            <option value="1">
              1,00 m
            </option>

            <option value="2" selected>
              2,00 m
            </option>

            <option value="5">
              5,00 m
            </option>

            <option value="10">
              10,00 m
            </option>

          </select>
        </label>


        <label class="setting">
          <span>Amostragem</span>

          <select id="resolution">

            <option value="45">
              45 m
            </option>

            <option value="60" selected>
              60 m
            </option>

            <option value="90">
              90 m
            </option>

          </select>
        </label>


        <label class="setting">
          <span>Curvas</span>

          <select id="curveMode">

            <option value="all" selected>
              Todas
            </option>

            <option value="major">
              Principais
            </option>

          </select>
        </label>


        <label class="setting">
          <span>Principal a cada</span>

          <select id="majorEvery">

            <option value="5" selected>
              A cada 5
            </option>

            <option value="10">
              A cada 10
            </option>

          </select>
        </label>

      </div>

      <div class="settings-info">

        <strong>Fonte de elevação</strong>

        <span>
          Copernicus DEM / Open-Meteo
        </span>

      </div>

    </section>


    <!-- =====================================================
         MAPA
         ===================================================== -->

    <main id="map"></main>


    <!-- =====================================================
         PAINEL DE CARREGAMENTO
         ===================================================== -->

    <div
      id="loading"
      class="loading hidden"
    >

      <div class="loading-card">

        <div class="spinner"></div>

        <div id="loadingText">
          Processando...
        </div>

      </div>

    </div>


    <!-- =====================================================
         ESTATÍSTICAS
         ===================================================== -->

    <section class="stats">

      <div class="stat">

        <strong id="vertexCount">
          0
        </strong>

        <span>
          vértices
        </span>

      </div>


      <div class="stat">

        <strong id="areaValue">
          0,00 ha
        </strong>

        <span>
          área
        </span>

      </div>


      <div class="stat">

        <strong id="minElevation">
          —
        </strong>

        <span>
          cota mínima
        </span>

      </div>


      <div class="stat">

        <strong id="maxElevation">
          —
        </strong>

        <span>
          cota máxima
        </span>

      </div>

    </section>


    <!-- =====================================================
         STATUS
         ===================================================== -->

    <section class="status-panel">

      <div id="status">
        Pronto. Toque em "Nova área" para começar.
      </div>

      <div class="legend">

        <div class="legend-item">

          <span class="legend-line normal"></span>

          <span>
            Curva
          </span>

        </div>


        <div class="legend-item">

          <span class="legend-line major"></span>

          <span>
            Curva principal
          </span>

        </div>


        <div class="dem-status">

          DEM:
          <strong id="demSource">
            —
          </strong>

        </div>

      </div>

    </section>


    <!-- =====================================================
         PAINEL DE ELEVAÇÕES
         ===================================================== -->

    <section
      id="elevationPanel"
      class="elevation-panel"
    >

      <div class="elevation-title">
        Pontos de elevação
      </div>

      <div id="elevationList">
        —
      </div>

    </section>


    <!-- =====================================================
         MENU DE EXPORTAÇÃO / IMPORTAÇÃO
         ===================================================== -->

    <section class="export-panel">

      <input
        id="kmlInput"
        type="file"
        accept=".kml,application/vnd.google-earth.kml+xml"
        hidden
      >

      <button
        id="importKmlBtn"
        class="secondary-btn"
        type="button"
      >
        📂 Importar KML
      </button>

      <button
        id="exportKmlBtn"
        class="secondary-btn"
        type="button"
      >
        ↓ KML
      </button>

      <button
        id="exportDxfBtn"
        class="secondary-btn"
        type="button"
      >
        ↓ DXF
      </button>

      <button
        id="exportCsvBtn"
        class="secondary-btn"
        type="button"
      >
        ↓ CSV
      </button>

    </section>


    <!-- =====================================================
         RODAPÉ
         ===================================================== -->

    <footer class="footer">

      <span>
        MVA Geo
      </span>

      <span>
        Contour Map
      </span>

      <span>
        DEM Copernicus GLO-90
      </span>

    </footer>

  </div>


  <!-- =====================================================
       BIBLIOTECAS
       ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <!-- Biblioteca principal do D3 (Necessária para o funcionamento do d3-contour) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <script
    src="https://cdn.jsdelivr.net/npm/d3-contour@4"
  ></script>


  <!-- =====================================================
       APLICAÇÃO
       ===================================================== -->

  <script src="./app.js"></script>

</body>
</html>
